name: (임시) EPO OPS 프로브

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: OPS 인증·검색 프로브
        env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: python probe_ops.py
