name: 전력 이슈 뉴스 아카이브

# ── 실행 시점 ───────────────────────────────────────────────
# cron 은 UTC 기준. "0 23 * * *" = 매일 23:00 UTC = 08:00 KST(다음날) → 아침에 갱신.
# 시간을 바꾸려면 원하는 KST 시각에서 9시간을 뺀 값을 UTC로 넣으세요.
on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 KST 매일
  # 특허 아카이브 초기화(PATENT_RESET)는 **주간 워크플로**에 있다. 여기는
  # --collect news 라 특허를 모으지 않아, 지우기만 하고 안 채운다(실측: 0건이 됐다).
  workflow_dispatch: {}    # Actions 탭에서 손으로 즉시 실행
  push:
    branches: [main]
    paths:
      - brief.json         # 서술형 브리핑 갱신(커밋) 시 즉시 재배포 (주간 Routine이 이 경로로 커밋)

# gh-pages 브랜치에 사이트를 push 하려면 write 필요
permissions:
  contents: write

# 동시에 두 번 돌아 gh-pages 를 서로 덮어쓰지 않도록 직렬화
concurrency:
  group: power-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # gh-pages 브랜치 접근용

      - name: 파이썬 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
        # 의존성 없음 — news_* 모듈은 표준 라이브러리만 사용

      - name: 이전 아카이브 복원 (gh-pages → _prev)
        run: |
          mkdir -p _prev
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git archive FETCH_HEAD | tar -x -C _prev
            echo "이전 아카이브 복원 완료"
          else
            echo "gh-pages 브랜치 없음 → 첫 실행(빈 아카이브에서 시작)"
          fi

      - name: 수집기 스모크 테스트 (네트워크 없이 라이브 경로 실행)
        run: python selftest.py

      - name: 전력 뉴스 수집 + 사이트 생성 (뉴스+특허 탭)
        env:
          NEWS_PREV_DIR: _prev     # 이전 뉴스·특허 아카이브 로드
          NEWS_SITE_DIR: site      # 전체 사이트 재생성 대상
          NEWS_MOCK: "off"         # 뉴스 실데이터 강제 (러너는 외부망 정상)
          # 특허 목록은 주간 워크플로가 담당한다. 여기서 도는 것은 두 가지다.
          #   collect_offices — 출원인×공개 특허청 정확 집계. KIPRIS 백엔드는 국내
          #     공보만 다뤄 특허청 축을 만들지 않으므로 빈 dict 을 돌려준다.
          #   patent_origin  — 해외 출원인 국적 보강. 해외 검색 응답에는 국적 칸이
          #     없어 4천여 곳이 미상으로 남았다 → 서지상세를 출원인당 한 번씩 조회해
          #     하루 상한만큼 채우고 stats.json 에 누적한다(며칠이면 다 찬다).
          #     실측 건당 약 5초, 여섯 갈래 동시라 상한 800곳이면 10분 남짓이다.
          # 백엔드를 명시해 기본값에 기대지 않는다.
          PATENT_MOCK: "off"
          PATENT_BACKEND: ${{ vars.PATENT_BACKEND || 'kipris' }}
          KIPRIS_KEY: ${{ secrets.KIPRIS_KEY }}
          OPS_KEY: ${{ secrets.OPS_KEY }}        # PATENT_BACKEND=ops 로 되돌릴 때만 쓰인다
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: python build_site.py --collect news

      - name: gh-pages 로 배포 (사이트 = 브랜치 루트)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch site/.nojekyll        # Jekyll 처리 비활성화(정적 그대로 서빙)
          cd site
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "전력 뉴스 아카이브 갱신 ($(date -u +%F))"
          # 매번 단일 커밋(orphan)으로 강제 푸시 → 히스토리 누적 없이 데이터는 유지.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: 사이트 아티팩트 업로드 (백업)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: power-news-site-${{ github.run_id }}
          path: site/
          retention-days: 14
