name: (임시) 출원인 검색어 프로브

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: OPS 검색어 후보 실측
        env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: python probe_names.py
