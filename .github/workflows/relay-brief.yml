name: 브리핑 중계 (claude/* → main)

# ── 왜 이 워크플로가 있나 ──────────────────────────────────
# 브리핑을 쓰는 Routine 세션은 `claude/` 접두사 브랜치에만 푸시할 수 있다.
# (Claude가 생성한 Routine 에는 'Allow unrestricted branch pushes' 토글이 없어
#  main 직접 푸시가 거부된다.)
# 그래서 Routine 은 claude/* 브랜치에 브리핑 파일만 올리고,
# 이 워크플로가 그 파일을 main 으로 옮긴 뒤 배포 워크플로를 직접 호출한다.
# GITHUB_TOKEN 은 이 저장소에 쓰기 권한이 있으므로 별도 설정이 필요 없다.
#
# 대상 파일 두 개:
#   brief.json         뉴스 서술형 브리핑(매일, 키=date)
#   patent_brief.json  특허 서술형 브리핑(매주, 키=week)
# 한 번에 둘 다 바뀌어도 각각 검증해 함께 커밋한다.
#
# 주의: GITHUB_TOKEN 으로 만든 push 는 다른 워크플로의 push 트리거를 발동시키지
# 않는다(무한 루프 방지). 그래서 마지막에 workflow_dispatch 로 명시 호출한다 —
# 이건 GitHub 이 허용하는 예외다.

on:
  push:
    # claude/** 전체를 받는다. 좁히고 싶은 마음이 들지만 좁히면 안 된다 —
    # Routine 세션이 어느 이름으로 밀지 우리가 정하지 못한다. 프롬프트는
    # claude/happy-bohr 를 쓰라고 하지만 세션의 outcome 브랜치는
    # claude/bold-hamilton 으로 잡혀 있고, 원격에는 그 접미사 판본들
    # (claude/bold-hamilton-7cn95a 등)이 실제로 쌓여 있다. 이름을 셋으로
    # 좁혀 뒀다가 Routine 이 다른 이름으로 밀면 중계가 통째로 안 깨어난다.
    #
    # 대가는 사람이 쓰는 작업 브랜치(claude/<기능이름>)에 푸시할 때도 수집이
    # 한 번 도는 것뿐이다. 수집은 --ref main 으로 부르므로 작업 브랜치 내용이
    # 배포되지 않고, 기사는 중복을 걸러 누적된다. 놓치는 쪽이 훨씬 비싸다.
    branches:
      - 'claude/**'
    # paths 필터를 두지 않는다.
    #
    # 전에는 brief.json·patent_brief.json 이 **바뀐** 푸시만 받았다. 그래서 새 뉴스가
    # 없어 브리핑을 새로 쓸 것이 없는 날에는 Routine 이 푸시를 해도(또는 아예 안 해도)
    # 중계가 돌지 않았고, 중계가 안 돌면 수집도 안 불렸다 — 하루 멈추면 스스로
    # 못 돌아오는 고리다. 2026-08-26·27 이틀 연속 GitHub 예약이 죽었을 때 이 고리가
    # 유일한 생명줄이었고, 그날 브리핑이 마침 바뀌었기에 살았을 뿐이다.
    #
    # 이제는 이 브랜치에 **푸시가 있었다는 사실 자체**를 아침 Routine 이 돌았다는
    # 신호로 본다. 내용이 그대로여도(빈 커밋이어도) 중계가 돌고, 중계는 아래에서
    # 조건 없이 수집을 부른다. 브리핑 파일이 안 바뀌면 main 에는 아무것도 안 올린다.
  workflow_dispatch:
    inputs:
      branch:
        description: 중계할 원본 claude/* 브랜치
        default: claude/happy-bohr

permissions:
  contents: write   # main 에 커밋·푸시
  actions: write    # 배포 워크플로 dispatch

concurrency:
  group: brief-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: main 체크아웃
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 푸시된 브랜치에서 브리핑 파일 가져와 검증
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            BR="${{ inputs.branch }}"
          fi
          echo "중계 원본 브랜치: ${BR}"
          git fetch origin "+refs/heads/${BR}:refs/remotes/origin/${BR}"
          mkdir -p /tmp/relay
          # 브랜치에 있는 파일만 가져온다(둘 중 하나만 바뀌는 게 보통).
          for f in brief.json patent_brief.json; do
            if git cat-file -e "origin/${BR}:${f}" 2>/dev/null; then
              git show "origin/${BR}:${f}" > "/tmp/relay/${f}"
              echo "가져옴: ${f}"
            fi
          done
          python3 - <<'PY'
          import json, pathlib
          # 뉴스는 date, 특허는 week 가 키. 본문은 body(문단 배열) 또는
          # sections(국내/해외로 나눈 구조) 중 하나만 있으면 된다.
          for name, keyfield in (('brief.json', 'date'), ('patent_brief.json', 'week')):
              p = pathlib.Path('/tmp/relay') / name
              if not p.is_file():
                  continue
              d = json.loads(p.read_text(encoding='utf-8'))
              for k in (keyfield, 'headline', 'points'):
                  assert d.get(k), f'{name} 에 {k} 가 비어 있음'
              assert d.get('body') or d.get('sections'), \
                  f'{name} 에 body 도 sections 도 없음'
              for s in (d.get('sections') or []):
                  assert s.get('label') and s.get('paras'), \
                      f'{name} 의 sections 항목에 label/paras 가 비어 있음'
              assert len(d['points']) == 3, \
                  f"{name} 의 points 는 3개여야 함 (현재 {len(d['points'])})"
              print(f'검증 OK — {name}: {d[keyfield]} | {d["headline"][:50]}')
          PY

      - name: main 에 반영
        id: apply
        run: |
          set -euo pipefail
          CHANGED=""
          for f in brief.json patent_brief.json; do
            [ -f "/tmp/relay/${f}" ] || continue
            if [ -f "${f}" ] && cmp -s "/tmp/relay/${f}" "${f}"; then
              echo "${f}: main 과 동일 — 생략"
              continue
            fi
            cp "/tmp/relay/${f}" "${f}"
            CHANGED="${CHANGED} ${f}"
          done
          if [ -z "${CHANGED}" ]; then
            echo "바뀐 브리핑 없음 — 중계 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG=$(python3 - <<'PY'
          import json, pathlib
          bits = []
          for name, keyfield, label in (('brief.json', 'date', '브리핑'),
                                        ('patent_brief.json', 'week', '특허 브리핑')):
              p = pathlib.Path(name)
              if p.is_file():
                  bits.append(f'{label} {json.loads(p.read_text(encoding="utf-8"))[keyfield]}')
          print('갱신: ' + ', '.join(bits))
          PY
          )
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${CHANGED}
          git commit -m "${MSG}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 브리핑이 바뀌었는지와 **무관하게** 부른다.
      #
      # 전에는 changed == 'true' 일 때만 불렀는데, 그게 순환 고리를 만들었다:
      #   수집이 돌아야 새 뉴스 날짜가 생기고
      #   → 새 뉴스 날짜가 있어야 Routine 이 브리핑을 새로 쓰고
      #   → 브리핑이 바뀌어야 여기서 수집을 부른다.
      # 어느 한 곳이 하루 멈추면 스스로 돌아오지 못한다. 실제로 2026-08-26·27
      # 이틀 연속 GitHub 예약(schedule)이 안 떴을 때, 아침 수집을 살려 둔 것이
      # 오직 이 호출뿐이었다 — 그날 브리핑이 마침 바뀌었기에 살았을 뿐이다.
      #
      # 이 워크플로가 돌았다는 것은 곧 아침 Routine 이 돌았다는 뜻이고, 그러면
      # 그날 수집은 부르는 것이 맞다. 수집은 같은 날 여러 번 돌아도 URL·제목으로
      # 중복을 걸러 이어 담으므로(누적), 한 번 더 부르는 쪽이 안전하다.
      - name: 배포 워크플로 호출
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run daily-power-news.yml --ref main
