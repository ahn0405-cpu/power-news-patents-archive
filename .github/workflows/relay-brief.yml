name: 브리핑 중계 (claude/brief → main)

# ── 왜 이 워크플로가 있나 ──────────────────────────────────
# 매일 브리핑을 쓰는 Routine 세션은 `claude/` 접두사 브랜치에만 푸시할 수 있다.
# (Claude가 생성한 Routine 에는 'Allow unrestricted branch pushes' 토글이 없어
#  main 직접 푸시가 거부된다.)
# 그래서 Routine 은 claude/brief 브랜치에 brief.json 만 올리고,
# 이 워크플로가 그 파일을 main 으로 옮긴 뒤 배포 워크플로를 직접 호출한다.
# GITHUB_TOKEN 은 이 저장소에 쓰기 권한이 있으므로 별도 설정이 필요 없다.
#
# 주의: GITHUB_TOKEN 으로 만든 push 는 다른 워크플로의 push 트리거를 발동시키지
# 않는다(무한 루프 방지). 그래서 마지막에 workflow_dispatch 로 명시 호출한다 —
# 이건 GitHub 이 허용하는 예외다.

on:
  push:
    branches:
      - 'claude/brief**'
    paths:
      - brief.json
  workflow_dispatch: {}    # 손으로 중계만 다시 돌리고 싶을 때

permissions:
  contents: write   # main 에 커밋·푸시
  actions: write    # 배포 워크플로 dispatch

concurrency:
  group: brief-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: main 체크아웃
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 푸시된 브랜치에서 brief.json 가져와 검증
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            BR="claude/brief"
          fi
          echo "중계 원본 브랜치: ${BR}"
          git fetch origin "+refs/heads/${BR}:refs/remotes/origin/${BR}"
          git show "origin/${BR}:brief.json" > /tmp/brief.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/brief.json'))
          for k in ('date', 'headline', 'body', 'points'):
              assert d.get(k), f'brief.json 에 {k} 가 비어 있음'
          assert len(d['points']) == 3, f"points 는 3개여야 함 (현재 {len(d['points'])})"
          print('검증 OK —', d['date'], '|', d['headline'][:50])
          PY

      - name: main 에 반영
        id: apply
        run: |
          set -euo pipefail
          if cmp -s /tmp/brief.json brief.json; then
            echo "main 의 brief.json 과 동일 — 중계 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp /tmp/brief.json brief.json
          D=$(python3 -c "import json;print(json.load(open('brief.json'))['date'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief.json
          git commit -m "브리핑 갱신: ${D}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 배포 워크플로 호출
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run daily-power-news.yml --ref main
