# 공공데이터포털 오픈API 응답 구조 확인 (수동 실행 전용).
#
# 개발 환경에서는 data.go.kr 접속이 막혀 있어 오퍼레이션·응답 필드를 볼 수 없다.
# 러너는 외부 인터넷이 열려 있으므로 여기서 한 번 돌려 로그로 구조를 확인한 뒤
# 수집기를 짠다. 정기 실행이 아니라 필요할 때만 손으로 돌린다(일일 트래픽 100회).
name: 오픈API 응답 구조 확인 (수동)

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "엔드포인트 URL (비우면 국유판매기술정보)"
        required: false
        default: ""
      ops:
        description: "오퍼레이션 이름(공백으로 구분, 비우면 기본 후보)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: 파이썬 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 시크릿이 비어 오면 이름이 다른 건지, 환경(Environment) 시크릿으로 들어간
      # 건지 로그만으로는 알 수 없다 → 흔한 이름 몇 개의 '길이'만 찍어 어느 것이
      # 채워져 있는지 본다. 값은 찍지 않는다(길이만).
      - name: 시크릿 이름 확인 (값은 찍지 않음)
        env:
          CTRL: ${{ secrets.OPS_KEY }}          # 대조군 — 이미 잘 도는 시크릿
          A: ${{ secrets.DATA_GO_KR_KEY }}
          B: ${{ secrets.DATA_GO_KR }}
          C: ${{ secrets.DATAGOKR_KEY }}
          D: ${{ secrets.PUBLIC_DATA_KEY }}
          E: ${{ secrets.SERVICE_KEY }}
          F: ${{ secrets.DATA_API_KEY }}
          # Variables 탭에 들어간 경우 secrets. 로는 안 잡히고 vars. 로 잡힌다.
          VA: ${{ vars.DATA_GO_KR_KEY }}
          VB: ${{ vars.DATA_GO_KR }}
          VC: ${{ vars.SERVICE_KEY }}
        run: |
          echo "[대조군] OPS_KEY: ${#CTRL}자  ← 0자면 시크릿 자체가 이 저장소에 안 붙은 것"
          echo "[Secrets 탭]"
          for n in A B C D E F; do v=$(eval echo \$$n); printf '  %s: %s자\n' "$n" "${#v}"; done
          echo "  A=DATA_GO_KR_KEY B=DATA_GO_KR C=DATAGOKR_KEY D=PUBLIC_DATA_KEY E=SERVICE_KEY F=DATA_API_KEY"
          echo "[Variables 탭]"
          for n in VA VB VC; do v=$(eval echo \$$n); printf '  %s: %s자\n' "$n" "${#v}"; done
          echo "  VA=DATA_GO_KR_KEY VB=DATA_GO_KR VC=SERVICE_KEY"
          echo "판정: 대조군이 0이 아니고 나머지가 전부 0 → 이 키만 저장이 안 된 것."
          echo "      Variables 쪽이 0이 아니면 → 탭을 잘못 고른 것(워크플로를 vars 로 바꾸면 됨)."

      - name: API 두드려 보기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python probe_api.py ${{ inputs.endpoint }} ${{ inputs.ops }}
