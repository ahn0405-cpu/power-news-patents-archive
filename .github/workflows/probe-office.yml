name: (임시) OPS 특허청 필터 프로브
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: python probe_office.py
